<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #login-screen {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #1a1a1a;
      color: white;
      padding: 20px;
    }

    #login-screen h2 {
      margin-bottom: 20px;
    }

    #login-screen input {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      width: 100%;
      max-width: 280px;
      margin-bottom: 15px;
      text-align: center;
    }

    #login-screen button {
      padding: 12px 30px;
      background: #c8102e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #chat-container {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1a1a1a;
      color: white;
      padding: 15px 20px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.sent {
      background: #c8102e;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.received {
      background: white;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    .message .time {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 4px;
      display: block;
    }

    #input-area {
      display: flex;
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
      gap: 10px;
    }

    #message-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 15px;
      outline: none;
    }

    #send-btn {
      background: #c8102e;
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Password Screen -->
  <div id="login-screen">
    <h2>Private Chat</h2>
    <input type="password" id="password-input" placeholder="Enter password">
    <button onclick="checkPassword()">Enter</button>
  </div>

  <!-- Chat Screen -->
  <div id="chat-container">
    <header>Private Chat</header>
    <div id="chat-box"></div>
    <div id="input-area">
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
      <button id="send-btn">➤</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // ======================
    // CHANGE THE PASSWORD HERE
    // ======================
    const CHAT_PASSWORD = "amber123";   // ← Change this to your own password

    function checkPassword() {
      const input = document.getElementById("password-input").value;
      if (input === CHAT_PASSWORD) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("chat-container").style.display = "flex";
        startChat();
      } else {
        alert("Wrong password");
      }
    }

    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBLxvT7qQpZNG9a_oDHKdhlUlHu0UoYxZE",
      authDomain: "privatechat-d07cc.firebaseapp.com",
      databaseURL: "https://privatechat-d07cc-default-rtdb.firebaseio.com",
      projectId: "privatechat-d07cc",
      storageBucket: "privatechat-d07cc.firebasestorage.app",
      messagingSenderId: "1001843094093",
      appId: "1:1001843094093:web:406588f476808a1deba204"
    };

    function startChat() {
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();
      const messagesRef = database.ref("messages");

      const chatBox = document.getElementById("chat-box");
      const messageInput = document.getElementById("message-input");
      const sendBtn = document.getElementById("send-btn");

      let userName = prompt("Enter your name:");
      if (!userName) userName = "Anonymous";

      function sendMessage() {
        const text = messageInput.value.trim();
        if (text === "") return;

        messagesRef.push({
          name: userName,
          text: text,
          timestamp: Date.now()
        });

        messageInput.value = "";
      }

      sendBtn.addEventListener("click", sendMessage);
      messageInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
      });

      messagesRef.on("child_added", function(snapshot) {
        const data = snapshot.val();
        const messageDiv = document.createElement("div");
        
        const isSent = data.name === userName;
        messageDiv.classList.add("message");
        messageDiv.classList.add(isSent ? "sent" : "received");

        const time = new Date(data.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        messageDiv.innerHTML = `
          <strong>${data.name}</strong><br>
          ${data.text}
          <span class="time">${time}</span>
        `;

        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }
  </script>
</body>
</html>
